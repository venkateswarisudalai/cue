# End-to-end tests for the web app on Windows and Linux, in Chromium, with no API keys:
# speech goes to a local Whisper server (whisper.cpp) and notes to local Ollama, the same
# stack as `npm run e2e` locally (see web/e2e/README.md).
name: Web end-to-end

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: web-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      WHISPER_REF: v1.9.4
      NOTES_MODEL: llama3.2
      OLLAMA_ORIGINS: "*"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # ---- Whisper (speech) ----
      - name: Cache whisper.cpp build and model
        id: whisper-cache
        uses: actions/cache@v4
        with:
          path: |
            whisper.cpp/build
            ggml-base.en.bin
          key: whisper-${{ runner.os }}-${{ env.WHISPER_REF }}

      - name: Build whisper-server
        if: steps.whisper-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$WHISPER_REF" https://github.com/ggml-org/whisper.cpp
          cmake -S whisper.cpp -B whisper.cpp/build -DCMAKE_BUILD_TYPE=Release -DWHISPER_BUILD_TESTS=OFF
          cmake --build whisper.cpp/build --config Release --target whisper-server -j 4
          curl -fsSL -o ggml-base.en.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.en.bin

      - name: Start whisper-server
        run: |
          BIN=$(find whisper.cpp/build -type f \( -name whisper-server -o -name whisper-server.exe \) | head -1)
          echo "whisper-server: $BIN"
          nohup "$BIN" -m ggml-base.en.bin --host 127.0.0.1 --port 8178 --inference-path /v1/audio/transcriptions > whisper.log 2>&1 &
          for i in $(seq 1 60); do curl -s -o /dev/null http://127.0.0.1:8178/ && break; sleep 2; done
          curl -s -o /dev/null -w "whisper: %{http_code}\n" http://127.0.0.1:8178/

      # ---- Ollama (notes and suggestions) ----
      - name: Install and start Ollama (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl stop ollama || true
          nohup ollama serve > ollama.log 2>&1 &

      - name: Install and start Ollama (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/ollama/ollama/releases/latest/download/ollama-windows-amd64.zip -OutFile ollama.zip
          Expand-Archive ollama.zip -DestinationPath ollama
          "$PWD\ollama" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Start-Process -FilePath "$PWD\ollama\ollama.exe" -ArgumentList serve -RedirectStandardOutput ollama.log -RedirectStandardError ollama.err -WindowStyle Hidden

      - name: Pull the notes model
        run: |
          for i in $(seq 1 60); do curl -s -o /dev/null http://127.0.0.1:11434/api/tags && break; sleep 2; done
          ollama pull "$NOTES_MODEL"
          # Warm it up so the first notes request doesn't time out on model load.
          curl -s http://127.0.0.1:11434/api/chat -d "{\"model\":\"$NOTES_MODEL\",\"stream\":false,\"messages\":[{\"role\":\"user\",\"content\":\"hi\"}]}" > /dev/null

      # ---- App + tests ----
      - name: Install, unit test, build
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build
          npx playwright install --with-deps chromium

      - name: End-to-end tests
        working-directory: web
        run: |
          nohup npx vite preview --port 4173 > preview.log 2>&1 &
          for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:4173/vantage/ && break; sleep 1; done
          npx playwright test --workers=1

      - name: Logs and report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.name }}
          path: |
            whisper.log
            ollama.log
            ollama.err
            web/preview.log
            web/test-results
          if-no-files-found: ignore
